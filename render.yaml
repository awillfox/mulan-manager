services:
  - type: web
    name: mulan-manager
    runtime: docker
    plan: starter
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: 3000
      - key: BODY_SIZE_LIMIT
        value: 11M # > backend's 10 MiB image cap; adapter-node defaults to 512K
      - key: BACKEND_URL
        sync: false # set to http://<backend-magicdns-host>:8080 in the dashboard
      - key: TS_HTTP_PROXY
        value: http://127.0.0.1:1055
      - key: TS_AUTHKEY
        sync: false # ephemeral, tagged Tailscale auth key — set as a secret
      - key: TS_HOSTNAME
        value: mulan-manager
      - key: PUBLIC_BOOKYMAN_URL
        value: https://bookyman.thgalleycafe.com/login # music player, on-prem via cloudflared
      - key: PUBLIC_BOOKYMAN_KEY
        sync: false # bookyman-remote ADMIN_PASSWORD; reaches the browser, set in the dashboard
